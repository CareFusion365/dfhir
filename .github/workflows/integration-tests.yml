name: Integration Tests

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/nebula_test

on:
  push:
    branches: ['main']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**/*.md'

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        # expose port 5432 on localhost
        ports:
          - 5432:5432
        # initialize the DB with a user/database/password
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebula_test
        # wait until Postgres is accepting connections
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions
        with:
          python-version: ${{ matrix.python-version }}
          run-poetry-install: true
          create-venv-at-path: .venv
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Run DB Migrations
        working-directory: .
        run: poetry run python manage.py migrate_all

      - name: Load DB Fixtures
        working-directory: .
        run: |
          for fixture in $(find dfhir/fixtures -type f -name "*.json"); do
            echo "Loading fixture: $fixture"
            poetry run python manage.py loaddata "$fixture"
          done

      - name: Run Django Tests
        working-directory: .
        run: poetry run pytest tests
